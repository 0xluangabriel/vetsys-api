services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: vetsys
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    volumes:
      - dados_mysql:/var/lib/mysql
      - ./docker/criar-usuarios.sh:/docker-entrypoint-initdb.d/criar-usuarios.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: mysql+pymysql://vetsys_migrator:${DB_MIGRATOR_PASSWORD}@db:3306/vetsys
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://vetsys_app:${DB_PASSWORD}@db:3306/vetsys
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: nginx:1.27-alpine
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  dados_mysql: